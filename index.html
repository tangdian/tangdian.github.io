<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虾哥 - OpenClaw AI 超级炫酷版 🦐✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* 背景粒子动画 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            text-align: center;
            padding: 40px 60px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 
                        0 0 100px rgba(118, 75, 162, 0.5);
            max-width: 900px;
            animation: slideUp 1s ease-out;
            transform-style: preserve-3d;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 4em;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 5s ease infinite, bounce 1.5s ease-in-out infinite;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .emoji-container {
            font-size: 8em;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
            text-shadow: 0 0 30px rgba(118, 75, 162, 0.8),
                         0 0 60px rgba(102, 126, 234, 0.6);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-5deg); }
            75% { transform: translateY(20px) rotate(5deg); }
        }

        @keyframes glow {
            from { text-shadow: 0 0 30px rgba(118, 75, 162, 0.8),
                         0 0 60px rgba(102, 126, 234, 0.6); }
            to { text-shadow: 0 0 40px rgba(118, 75, 162, 1),
                         0 0 80px rgba(102, 126, 234, 0.8); }
        }

        .features {
            text-align: left;
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-radius: 20px;
        }

        .features li {
            margin: 20px 0;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease backwards;
        }

        .features li:nth-child(1) { animation-delay: 0.2s; }
        .features li:nth-child(2) { animation-delay: 0.4s; }
        .features li:nth-child(3) { animation-delay: 0.6s; }
        .features li:nth-child(4) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .features li:before {
            content: '✨';
            margin-right: 15px;
            font-size: 1.5em;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .features:hover li {
            transform: translateX(10px);
            color: #764ba2;
        }

        .tech-stack {
            margin-top: 25px;
            font-size: 0.9em;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        footer {
            margin-top: 40px;
            font-size: 0.85em;
            opacity: 0.7;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 2.5em; }
            .emoji-container { font-size: 5em; }
        }

        /* 鼠标悬停特效 */
        .container:hover {
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5), 
                        0 0 120px rgba(118, 75, 162, 0.6);
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="emoji-container">🦐✨</div>
        
        <h1>OpenClaw AI 超级炫酷版！</h1>
        
        <div class="features">
            <ul>
                <li><strong>🌈 流光特效</strong> - 渐变背景和动态颜色</li>
                <li><strong>✨ 粒子动画</strong> - 悬浮的星星和魔法效果</li>
                <li><strong>💫 3D 交互</strong> - 鼠标悬停产生炫酷反馈</li>
                <li><strong>🚀 性能优化</strong> - 流畅的 CSS3 动画</li>
            </ul>
        </div>
        
        <div class="tech-stack">
            Powered by Qwen 3.5-9b | OpenClaw v2026.3.28<br>
            ✨ Created with ❤️ by Dean Tang 🦐
        </div>

        <a href="#" class="btn" onclick="alert('虾哥超能力已激活！🦐⚡')">点击体验更多功能</a>

        <footer>
            © 2026 OpenClaw AI Assistant | 使用 Ctrl+G 召唤虾哥
        </footer>
    </div>

    <script>
        // 创建动态粒子
        const particlesContainer = document.getElementById('particles');
        const emojis = ['✨', '⭐', '💫', '🌟', '💎', '🦐'];
        
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('span');
            particle.classList.add('particle');
            particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            
            // 随机位置和动画参数
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.fontSize = (Math.random() * 20 + 15) + 'px';
            
            particlesContainer.appendChild(particle);
        }

        // 鼠标移动时的容器旋转效果
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            container.style.transform = `rotateY(${x * 4}deg) rotateX(${-y * 3}deg)`;
        });

        // 添加波浪背景效果
        function createWaves() {
            const bg = document.querySelector('body');
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const wave = document.createElement('div');
                    wave.style.position = 'fixed';
                    wave.style.width = '100vw';
                    wave.style.height = '200px';
                    wave.style.background = 'linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent)';
                    wave.style.bottom = '-200px';
                    wave.style.animation = 'wave 4s ease-in-out infinite';
                    wave.style.opacity = Math.random() * 0.3;
                    
                    bg.appendChild(wave);
                }, i * 1000);
            }
        }

        // 添加波浪动画
        const styles = document.createElement('style');
        styles.textContent = `
            @keyframes wave {
                0%, 100% { transform: translateX(0); }
                50% { transform: translateX(100px); }
            }
        `;
        document.head.appendChild(styles);
        
        setTimeout(createWaves, 500);
    </script>
</body>
</html>
